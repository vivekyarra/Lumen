<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — demo film</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("/fonts/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("/fonts/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("/fonts/inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("/fonts/inter-latin-800-normal.woff2") format("woff2"); }
  :root { --bg: #05080d; --ink: #f4f7fa; --mute: #8b97a6; --cyan: #3fe0ff; --green: #3dff7a; --red: #ff4d4d; --amber: #ffb020; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .abs { position: absolute; }
  .eyebrow { font-weight: 600; font-size: 22px; letter-spacing: .42em; text-transform: uppercase; color: var(--mute); }
  .h1 { font-weight: 800; font-size: 92px; letter-spacing: -.02em; line-height: 1.02; }
  .h2 { font-weight: 700; font-size: 64px; letter-spacing: -.015em; line-height: 1.08; }
  .h3 { font-weight: 600; font-size: 40px; line-height: 1.2; }
  .body { font-weight: 400; font-size: 26px; line-height: 1.4; color: #c4ccd6; }
  .accent { color: var(--cyan); }
  .glass { background: linear-gradient(180deg, rgba(22,32,44,.78), rgba(10,15,22,.78)); border: 1.5px solid rgba(63,224,255,.38);
           border-radius: 22px; box-shadow: 0 0 0 1px rgba(255,255,255,.03) inset, 0 0 34px rgba(63,224,255,.16), 0 24px 60px rgba(0,0,0,.5); }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 22px;
          background: rgba(10,16,24,.82); border: 1.5px solid rgba(63,224,255,.4); color: var(--ink); }
  .tag { font-weight: 700; font-size: 15px; letter-spacing: .16em; padding: 6px 10px; border-radius: 8px; background: rgba(63,224,255,.12); color: var(--cyan); }
  .word { display: inline-block; white-space: pre; }
  #caption { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); max-width: 1280px; text-align: center;
             font-weight: 600; font-size: 30px; line-height: 1.3; padding: 12px 26px; border-radius: 14px;
             background: rgba(5,9,14,.72); border: 1px solid rgba(255,255,255,.08); }
  #caption .word { color: rgba(244,247,250,.42); }
  #caption .word.on { color: #fff; }
  #grain { position: absolute; inset: -50%; opacity: .05; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(63,224,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(63,224,255,.05) 1px, transparent 1px);
          background-size: 64px 64px; mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 75%); }
  img.footage { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: auto; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="layers"></div>
  <div id="caption"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
</div>
<script type="module" src="/film.js"></script>
</body>
</html>
